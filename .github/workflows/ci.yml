name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test,public]'
      - run: pytest -q
      - run: judge-bias demo --out /tmp/demo
      - name: prompts still match the pinned hash
        run: judge-bias fetch --dest /tmp/q.jsonl && test "$(wc -l < /tmp/q.jsonl)" -eq 80
      - name: published judgments reproduce the README number
        run: |
          judge-bias public --out /tmp/pub | tee /tmp/pub.txt
          grep -q "| gpt-4 | 290 | 0.853 | 0.732 | +0.120 |" /tmp/pub.txt
